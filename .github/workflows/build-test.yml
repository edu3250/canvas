name: Compilar y probar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Compilar en Release
        run: dotnet build EscritorioCanvas.sln -c Release
      - name: Ejecutar pruebas en Release con cobertura
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath TestResults) {
            throw 'TestResults debe estar limpio antes de ejecutar las pruebas.'
          }
          dotnet test EscritorioCanvas.sln -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Comprobar la cobertura del dominio
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -LiteralPath TestResults -Recurse -File -Filter coverage.cobertura.xml)
          if ($reports.Count -ne 1) {
            throw "Se esperaba un informe coverage.cobertura.xml y se encontraron $($reports.Count)."
          }
          pwsh -NoProfile -File eng/Check-Coverage.ps1 -Path $reports[0].FullName
      - name: Verificar el control de cobertura
        shell: pwsh
        run: pwsh -NoProfile -File eng/Test-CoverageGate.ps1
